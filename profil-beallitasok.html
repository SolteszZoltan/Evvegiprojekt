<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beállítások – Prónyó Kicks</title>
    <link rel="stylesheet" href="cipok.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700;900&family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="auth.js" defer></script>
    <script src="cookie-consent.js" defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f0f0f0;
            font-family: 'Open Sans', sans-serif;
            min-height: 100vh;
        }

        .page-hero {
            background: linear-gradient(135deg, #1a2535 0%, #22313F 100%);
            padding: 135px 40px 50px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .page-hero::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: rgba(248,216,0,0.05);
            top: -200px; right: -100px;
            pointer-events: none;
        }
        .page-hero-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .page-hero-title span { color: #F8D800; }
        .page-hero-sub {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* Avatar section */
        .avatar-section {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            padding: 30px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .avatar-circle {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: #F8D800;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 900;
            font-size: 36px;
            color: #000;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(248,216,0,0.35);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .avatar-circle:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(248,216,0,0.45); }
        .avatar-circle img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .avatar-change-overlay {
            position: absolute;
            bottom: 0; right: 0;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: #28406b;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .avatar-change-overlay:hover { background: #F8D800; color: #000; }
        #avatar-file-input { display: none; }

        .avatar-info h2 {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 900;
            font-size: 1.3rem;
            color: #1a2535;
        }
        .avatar-info p {
            color: rgba(0,0,0,0.4);
            font-size: 13px;
            margin-top: 4px;
        }
        .avatar-info .avatar-hint {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: rgba(0,0,0,0.3);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* Settings cards */
        .settings-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            padding: 28px 30px;
            margin-bottom: 16px;
        }
        .settings-card-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(0,0,0,0.35);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-card-title i { font-size: 12px; }

        .field-group {
            margin-bottom: 18px;
        }
        .field-group:last-child { margin-bottom: 0; }

        .field-label {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(0,0,0,0.4);
            margin-bottom: 8px;
        }
        .field-input-wrap {
            position: relative;
        }
        .field-input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(0,0,0,0.3);
            font-size: 13px;
        }
        .field-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: #f7f8fa;
            border: 1.5px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            color: #1a2535;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .field-input:focus {
            border-color: #28406b;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(40,64,107,0.08);
        }
        .field-input.error { border-color: #e0574f; background: rgba(224,87,79,0.04); }
        .field-input.success { border-color: #2ecc71; }

        .field-hint {
            font-size: 11px;
            color: rgba(0,0,0,0.35);
            margin-top: 6px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .field-hint.error-msg { color: #e0574f; }
        .field-hint.success-msg { color: #27ae60; }

        .save-btn {
            width: 100%;
            padding: 13px;
            background: #28406b;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .save-btn:hover { background: #F8D800; color: #000; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(248,216,0,0.3); }
        .save-btn:active { transform: translateY(0); }
        .save-btn.loading { opacity: 0.7; cursor: not-allowed; pointer-events: none; }

        /* Password field */
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(0,0,0,0.3);
            font-size: 13px;
            padding: 4px;
        }
        .password-toggle:hover { color: #28406b; }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            margin-top: 14px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .alert.success { background: rgba(46,204,113,0.1); border: 1px solid rgba(46,204,113,0.3); color: #27ae60; display: flex; }
        .alert.error   { background: rgba(224,87,79,0.1);  border: 1px solid rgba(224,87,79,0.3);  color: #c0392b;  display: flex; }

        /* Login wall */
        .login-wall {
            text-align: center;
            padding: 100px 20px;
        }
        .login-wall-icon { font-size: 56px; margin-bottom: 20px; }
        .login-wall-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.4rem;
            font-weight: 900;
            color: #1a2535;
            margin-bottom: 10px;
        }
        .login-wall-sub { color: rgba(0,0,0,0.5); margin-bottom: 24px; font-size: 14px; }
        .login-wall-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 32px;
            background: #F8D800;
            color: #000;
            border-radius: 10px;
            text-decoration: none;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 900;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .login-wall-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(248,216,0,0.4); }

        @media (max-width: 500px) {
            .avatar-section { flex-direction: column; text-align: center; }
            .page-hero-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class='navbar'>
        <div class='logo'>
            <a href="index.html"><img src="logo.png" alt="logo" class="hatter"></a>
        </div>
        <div class='account-container'></div>
        <a href="kosar.html" class='cart-container'>
            <i class="fa fa-shopping-cart"></i>
            <div class='cart-desc'><span class="kosar">🛒 <span id="cart-count">0</span> Kosár</span></div>
        </a>
    </div>

    <div class="page-hero">
        <div class="page-hero-title">⚙️ Beállítások</div>
        <div class="page-hero-sub">// profil szerkesztése</div>
    </div>

    <div class="container" id="main-container">
        <!-- filled by JS -->
    </div>

    <script>
        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('pronyo_current_user') || 'null');
        }
        function getUsers() {
            return JSON.parse(localStorage.getItem('pronyo_users') || '[]');
        }
        function saveUsers(users) {
            localStorage.setItem('pronyo_users', JSON.stringify(users));
        }
        function setCurrentUser(u) {
            localStorage.setItem('pronyo_current_user', JSON.stringify(u));
        }

        function init() {
            const user = getCurrentUser();
            const container = document.getElementById('main-container');

            if (!user) {
                container.innerHTML = `
                    <div class="login-wall">
                        <div class="login-wall-icon">🔐</div>
                        <div class="login-wall-title">Bejelentkezés szükséges</div>
                        <div class="login-wall-sub">A beállítások eléréséhez kérjük, lépj be.</div>
                        <a href="login.html" class="login-wall-btn"><i class="fas fa-sign-in-alt"></i> Bejelentkezés</a>
                    </div>`;
                return;
            }

            const avatarData = localStorage.getItem('pronyo_avatar_' + user.email) || '';
            const initial = (user.name || '?').charAt(0).toUpperCase();

            container.innerHTML = `
                <!-- Avatar section -->
                <div class="avatar-section">
                    <div class="avatar-wrap">
                        <div class="avatar-circle" id="avatar-preview" onclick="document.getElementById('avatar-file-input').click()">
                            ${avatarData
                                ? `<img src="${avatarData}" alt="avatar">`
                                : `<span id="avatar-initial">${initial}</span>`}
                        </div>
                        <div class="avatar-change-overlay" onclick="document.getElementById('avatar-file-input').click()">
                            <i class="fas fa-camera"></i>
                        </div>
                        <input type="file" id="avatar-file-input" accept="image/*">
                    </div>
                    <div class="avatar-info">
                        <h2 id="display-name">${user.name || ''}</h2>
                        <p id="display-email">${user.email || ''}</p>
                        <div class="avatar-hint">// Kattints a képre a profilkép módosításához</div>
                    </div>
                </div>

                <!-- Name change -->
                <div class="settings-card">
                    <div class="settings-card-title"><i class="fas fa-user"></i> Névváltoztatás</div>
                    <div class="field-group">
                        <label class="field-label" for="new-name">Teljes név</label>
                        <div class="field-input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="new-name" class="field-input" value="${user.name || ''}" placeholder="Teljes neved">
                        </div>
                    </div>
                    <button class="save-btn" id="save-name-btn">
                        <i class="fas fa-check"></i> Név mentése
                    </button>
                    <div class="alert" id="name-alert"></div>
                </div>

                <!-- Email change -->
                <div class="settings-card">
                    <div class="settings-card-title"><i class="fas fa-envelope"></i> Email cím módosítása</div>
                    <div class="field-group">
                        <label class="field-label" for="new-email">Új email cím</label>
                        <div class="field-input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="new-email" class="field-input" placeholder="uj@email.com">
                        </div>
                        <div class="field-hint">// A jelenlegi: ${user.email}</div>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="email-confirm-pass">Jelszó megerősítés</label>
                        <div class="field-input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="email-confirm-pass" class="field-input" placeholder="Add meg a jelszavad">
                        </div>
                    </div>
                    <button class="save-btn" id="save-email-btn">
                        <i class="fas fa-check"></i> Email mentése
                    </button>
                    <div class="alert" id="email-alert"></div>
                </div>

                <!-- Password change -->
                <div class="settings-card">
                    <div class="settings-card-title"><i class="fas fa-lock"></i> Jelszó megváltoztatása</div>
                    <div class="field-group">
                        <label class="field-label" for="old-pass">Jelenlegi jelszó</label>
                        <div class="field-input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="old-pass" class="field-input" placeholder="••••••••">
                            <span class="password-toggle" onclick="togglePw('old-pass', this)"><i class="fas fa-eye"></i></span>
                        </div>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="new-pass">Új jelszó</label>
                        <div class="field-input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="new-pass" class="field-input" placeholder="Min. 6 karakter">
                            <span class="password-toggle" onclick="togglePw('new-pass', this)"><i class="fas fa-eye"></i></span>
                        </div>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="new-pass2">Új jelszó újra</label>
                        <div class="field-input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="new-pass2" class="field-input" placeholder="••••••••">
                        </div>
                    </div>
                    <button class="save-btn" id="save-pass-btn">
                        <i class="fas fa-check"></i> Jelszó mentése
                    </button>
                    <div class="alert" id="pass-alert"></div>
                </div>
            `;

            // ── Avatar upload ──────────────────────────────────────────
            document.getElementById('avatar-file-input').addEventListener('change', function () {
                const file = this.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) {
                    alert('A kép mérete max 2MB lehet!');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function (e) {
                    const data = e.target.result;
                    localStorage.setItem('pronyo_avatar_' + user.email, data);
                    const preview = document.getElementById('avatar-preview');
                    preview.innerHTML = `<img src="${data}" alt="avatar">`;
                    showAlert('name-alert', 'success', '✅ Profilkép sikeresen frissítve!');
                };
                reader.readAsDataURL(file);
            });

            // ── Name save ─────────────────────────────────────────────
            document.getElementById('save-name-btn').addEventListener('click', function () {
                const newName = document.getElementById('new-name').value.trim();
                if (!newName) {
                    showAlert('name-alert', 'error', '⚠️ A név nem lehet üres!');
                    return;
                }
                const users = getUsers();
                const idx = users.findIndex(u => u.email === user.email);
                if (idx !== -1) {
                    users[idx].name = newName;
                    saveUsers(users);
                }
                const updated = { ...user, name: newName };
                setCurrentUser(updated);
                document.getElementById('display-name').textContent = newName;
                document.getElementById('avatar-initial') && (document.getElementById('avatar-initial').textContent = newName.charAt(0).toUpperCase());
                showAlert('name-alert', 'success', '✅ Név sikeresen frissítve!');
                // Reload navbar
                setTimeout(() => window.location.reload(), 1200);
            });

            // ── Email save ────────────────────────────────────────────
            document.getElementById('save-email-btn').addEventListener('click', function () {
                const newEmail = document.getElementById('new-email').value.trim();
                const confirmPass = document.getElementById('email-confirm-pass').value;

                if (!newEmail) {
                    showAlert('email-alert', 'error', '⚠️ Add meg az új email-t!');
                    return;
                }
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(newEmail)) {
                    showAlert('email-alert', 'error', '⚠️ Érvénytelen email cím!');
                    return;
                }
                if (!confirmPass) {
                    showAlert('email-alert', 'error', '⚠️ Add meg a jelszavadat!');
                    return;
                }

                const users = getUsers();
                const me = users.find(u => u.email === user.email);
                if (!me || me.password !== confirmPass) {
                    showAlert('email-alert', 'error', '❌ Helytelen jelszó!');
                    return;
                }
                if (users.some(u => u.email === newEmail && u.email !== user.email)) {
                    showAlert('email-alert', 'error', '❌ Ez az email cím már foglalt!');
                    return;
                }

                // Move avatar data
                const oldAvatar = localStorage.getItem('pronyo_avatar_' + user.email);
                if (oldAvatar) {
                    localStorage.setItem('pronyo_avatar_' + newEmail, oldAvatar);
                    localStorage.removeItem('pronyo_avatar_' + user.email);
                }

                me.email = newEmail;
                saveUsers(users);
                const updated = { ...user, email: newEmail };
                setCurrentUser(updated);

                showAlert('email-alert', 'success', '✅ Email sikeresen frissítve! Átirányítás...');
                setTimeout(() => window.location.reload(), 1500);
            });

            // ── Password save ─────────────────────────────────────────
            document.getElementById('save-pass-btn').addEventListener('click', function () {
                const oldPass = document.getElementById('old-pass').value;
                const newPass = document.getElementById('new-pass').value;
                const newPass2 = document.getElementById('new-pass2').value;

                if (!oldPass || !newPass || !newPass2) {
                    showAlert('pass-alert', 'error', '⚠️ Töltsd ki az összes mezőt!');
                    return;
                }

                const users = getUsers();
                const me = users.find(u => u.email === user.email);
                if (!me || me.password !== oldPass) {
                    showAlert('pass-alert', 'error', '❌ Helytelen jelenlegi jelszó!');
                    return;
                }
                if (newPass.length < 6) {
                    showAlert('pass-alert', 'error', '⚠️ Az új jelszó legalább 6 karakter legyen!');
                    return;
                }
                if (newPass !== newPass2) {
                    showAlert('pass-alert', 'error', '❌ A két jelszó nem egyezik!');
                    return;
                }

                me.password = newPass;
                saveUsers(users);
                showAlert('pass-alert', 'success', '✅ Jelszó sikeresen megváltoztatva!');
                document.getElementById('old-pass').value = '';
                document.getElementById('new-pass').value = '';
                document.getElementById('new-pass2').value = '';
            });
        }

        function showAlert(id, type, msg) {
            const el = document.getElementById(id);
            if (!el) return;
            el.className = 'alert ' + type;
            el.textContent = msg;
            el.style.display = 'flex';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        function togglePw(inputId, iconEl) {
            const input = document.getElementById(inputId);
            const icon = iconEl.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
